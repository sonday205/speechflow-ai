services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: speechflow-ai-backend:gpu
    container_name: speechflow-ai-backend
    ports:
      - "8000:8000"
    environment:
      APP_NAME: SpeechFlow AI Backend
      APP_ENV: development
      BACKEND_HOST: http://localhost:8000
      FRONTEND_ORIGIN: http://localhost:5173
      FRONTEND_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      WHISPER_MODEL: small.en
      WHISPER_DEVICE: cuda
      WHISPER_COMPUTE_TYPE: int8_float16
      MAX_AUDIO_DURATION_SECONDS: "600"
      MAX_FILE_SIZE_MB: "100"
      CHUNK_LENGTH_SECONDS: "60"
      CHUNK_OVERLAP_SECONDS: "2"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ./backend/storage:/app/storage
      - ./backend/.cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=3).close()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
